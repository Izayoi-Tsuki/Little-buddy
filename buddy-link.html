<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>桌宠组队</title><link rel="stylesheet" href="/buddy-link.css"><script type="module" src="/src/buddy-link.mjs"></script></head>
<body>
  <header><span class="pin" aria-hidden="true"></span><strong id="link-title">桌宠组队</strong><button id="link-close" type="button" aria-label="取消">×</button></header>
  <main>
    <canvas id="link-preview" width="160" height="52" aria-hidden="true"></canvas>
    <p id="link-note" hidden></p>
    <div id="link-options" role="group" aria-label="选择关系"></div>
    <p id="link-error" role="status" hidden></p>
    <div class="buttons"><button id="link-cancel" type="button">取消</button></div>
  </main>
  <p id="browser-warning" hidden>请通过 npm run desktop:files 启动文件桌宠。</p>
</body>
</html>
